[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-inventory-system"
version = "2.0.1"
description = "Evolved Mini Inventory System with Barcode, Reorder Point alerts and CSV reporting"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pawaris Khoonsri (Project Manager)" },
    { name = "Phanawut Apipasanti (Tech Lead)" },
    { name = "Trairat Wongsit (QA)" },
    { name = "Taweechai Tijai (Developer)" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
# ตั้งใจไม่มี runtime dependency — ใช้แค่ standard library
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "flake8>=7.0", "bandit>=1.7"]

[project.scripts]
mini-inventory = "app_v2:main"

[project.urls]
Repository = "https://github.com/PeawZaZa/software_mnm"

[tool.setuptools]
py-modules = ["app_v2"]
