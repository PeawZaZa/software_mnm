name: Python Tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  test:
    # ชื่อนี้คือชื่อที่ไปโผล่ใน Status Check ของ Branch Protection — ห้ามเปลี่ยน
    name: PyTest CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint (Flake8)
      run: flake8 . --count --statistics

    - name: Security scan (Bandit — ล้มเมื่อพบ Medium ขึ้นไป)
      run: bandit -r . -x ./test_app.py,./test_app_v2.py,./test_hardening.py,./test_deployment.py,./test_disaster_recovery.py -ll

    - name: Run PyTest with coverage (ต้องไม่ต่ำกว่า 90%)
      run: pytest -v --cov=app_v2 --cov-report=term-missing --cov-fail-under=90
